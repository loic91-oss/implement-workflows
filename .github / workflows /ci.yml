name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cmake -S . -B build
      - run: cmake --build build
      - uses: actions/upload-artifact@v7
        with:
          name: bin
          path: build/cpu_monitor_app
